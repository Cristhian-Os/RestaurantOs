<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / Instalación -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RestaurantOS" />
    <meta name="theme-color" content="#FAFAF8" />
    <meta name="msapplication-TileColor" content="#FAFAF8" />
    <meta name="msapplication-TileImage" content="/icon-144x144.png" />

    <!-- Iconos -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-72x72.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-180x180.png" />

    <!-- SEO & Open Graph -->
    <title>RestaurantOS</title>
    <meta name="description" content="Sistema de gestión para restaurantes — punto de venta multi-rol con cocina, caja y menú digital." />
    <meta name="keywords" content="restaurante, POS, punto de venta, gestión, menú digital, caja" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RestaurantOS" />
    <meta property="og:description" content="Sistema de gestión para restaurantes — punto de venta multi-rol." />
    <meta property="og:url" content="https://usarestaurantos.com/" />
    <meta property="og:site_name" content="RestaurantOS" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:image" content="https://usarestaurantos.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://usarestaurantos.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta property="og:image:alt" content="RestaurantOS — Toda tu operación. Un solo sistema." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://usarestaurantos.com/og-image.jpg" />
    <meta name="twitter:title" content="RestaurantOS" />
    <meta name="twitter:description" content="Sistema de gestión para restaurantes." />


    <!-- Estilos críticos inline — previenen flash blanco en móvil -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      /* El fondo sigue el tema (--w-bg); el crema es solo el valor previo a que cargue el CSS */
      html { background: var(--w-bg, #F4EEE4); overflow-x: hidden; overflow-x: clip; }
      body {
        background-color: var(--w-bg, #F4EEE4);
        font-family: 'Inter Variable', ui-sans-serif, system-ui, sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        overflow-x: clip;
        max-width: 100%;
        /* Safe area para notch iOS */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        background-color: var(--w-bg, #F4EEE4);
      }
      /* Prevenir tap highlight azul en mobile */
      * { -webkit-tap-highlight-color: transparent; }
      img { max-width: 100%; display: block; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #FAFAF8; }
      ::-webkit-scrollbar-thumb { background: rgba(140,150,175,0.5); border-radius: 4px; }
    </style>
  </head>
  <body>
    <!-- Limpieza de caché al cargar — garantiza versión fresca del SW.
         Este literal debe coincidir siempre con CACHE en public/sw.js. -->
    <script>
      (function() {
        // Limpiar cachés viejos
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) {
              if (key !== 'ros-v22') caches.delete(key);
            });
          });
        }
      })();
    </script>

    <div id="root">
      <!-- Splash nativo — visible antes de que React cargue (0ms delay) -->
      <div id="native-splash" style="position:fixed;inset:0;background:#FAFAF8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;font-family:'Inter Variable',sans-serif;z-index:9999;">
        <div style="width:80px;height:80px;border-radius:1.25rem;overflow:hidden;flex-shrink:0;box-shadow:0 8px 24px rgba(70,50,35,0.12);background:#FAFAF8;">
          <img src="/logo.jpg" alt="RestaurantOS" style="width:100%;height:100%;object-fit:contain;display:block;" onerror="this.style.display='none'" />
        </div>
        <p style="color:#2B2018;font-weight:700;font-size:1.125rem;margin:0;">RestaurantOS</p>
        <div style="width:32px;height:32px;border-radius:50%;border:3px solid #F1E6DC;border-top-color:#FF5A00;animation:rs 0.8s linear infinite;"></div>
        <style>@keyframes rs{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
