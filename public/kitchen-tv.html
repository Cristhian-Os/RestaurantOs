<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina — RestaurantOS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #1a1410;
    --surface:  #221c16;
    --border:   #3a2f26;
    --ink:      #f0e8dc;
    --ink-soft: #a89880;
    --terra:    #c4622d;
    --olive:    #5a7a3a;
    --saffron:  #d4963a;
    --wine:     #8b2635;
    --white:    #ffffff;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg:       #f5f0ea;
      --surface:  #ffffff;
      --border:   #ddd5c8;
      --ink:      #1a1410;
      --ink-soft: #6b5a48;
      --terra:    #c4622d;
      --olive:    #4a6a2a;
      --saffron:  #b8820a;
      --wine:     #8b2635;
      --white:    #ffffff;
    }
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, Arial, sans-serif;
    min-height: 100vh;
    padding: 1rem;
  }

  /* ── Header ── */
  #header {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  #header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--ink);
  }

  #header-right {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    gap: 1rem;
  }

  #status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--olive);
    display: inline-block;
    margin-right: 6px;
  }

  #status-text {
    font-size: 0.8125rem;
    color: var(--ink-soft);
  }

  #order-count {
    font-size: 0.8125rem;
    color: var(--ink-soft);
  }

  /* ── Grid ── */
  #grid {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    gap: 1rem;
    -webkit-box-align: start;
    -ms-flex-align: start;
    align-items: flex-start;
  }

  .col {
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    border-radius: 1rem;
    padding: 0.875rem;
    min-height: 200px;
  }

  .col-pending { background: rgba(212,150,58,0.10); border: 1px solid rgba(212,150,58,0.30); }
  .col-cooking { background: rgba(196,98,45,0.10);  border: 1px solid rgba(196,98,45,0.30); }
  .col-ready   { background: rgba(90,122,58,0.10);  border: 1px solid rgba(90,122,58,0.30); }

  .col-header {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;
    margin-bottom: 0.875rem;
  }

  .col-label {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .col-pending .col-label { color: var(--saffron); }
  .col-cooking .col-label { color: var(--terra); }
  .col-ready   .col-label { color: var(--olive); }

  .col-badge {
    border-radius: 999px;
    min-width: 24px;
    height: 24px;
    padding: 0 6px;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--white);
  }

  .col-pending .col-badge { background: var(--saffron); }
  .col-cooking .col-badge { background: var(--terra); }
  .col-ready   .col-badge { background: var(--olive); }

  .col-empty {
    text-align: center;
    padding: 2rem 0;
    font-size: 0.8125rem;
    color: var(--ink-soft);
  }

  /* ── Order Card ── */
  .card {
    background: var(--surface);
    border-radius: 0.875rem;
    padding: 0.875rem;
    border: 1px solid var(--border);
    margin-bottom: 0.75rem;
  }

  .card.urgent {
    border-color: var(--wine);
    border-width: 2px;
  }

  .card-top {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink);
  }

  .card-ref {
    font-size: 0.6875rem;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .paid-badge {
    display: inline-block;
    margin-top: 4px;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 0.6875rem;
    font-weight: 700;
    color: var(--white);
  }

  .paid-badge.paid   { background: var(--olive); }
  .paid-badge.unpaid { background: var(--wine); }

  .card-timer {
    font-size: 1rem;
    font-weight: 700;
    text-align: right;
    color: var(--ink-soft);
  }

  .card-timer.urgent { color: var(--wine); }
  .urgent-label {
    font-size: 0.625rem;
    font-weight: 800;
    color: var(--wine);
    text-align: right;
  }

  /* Items */
  .items-box {
    background: var(--bg);
    border-radius: 0.75rem;
    padding: 0.75rem;
    border: 1px solid var(--border);
    margin-bottom: 0.75rem;
  }

  .item-row {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }

  .item-row:last-child { margin-bottom: 0; }

  .item-qty {
    min-width: 50px;
    height: 50px;
    padding: 0 12px;
    border-radius: 1rem;
    background: var(--terra);
    color: var(--white);
    font-size: 1.5rem;
    font-weight: 700;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    -ms-flex-negative: 0;
    flex-shrink: 0;
  }

  .item-name {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--ink);
  }

  .item-notes {
    font-size: 0.6875rem;
    color: var(--saffron);
    font-weight: 600;
    margin-top: 2px;
  }

  .card-notes {
    font-size: 0.75rem;
    color: var(--ink-soft);
    background: var(--bg);
    border-radius: 0.5rem;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
    margin-bottom: 0.75rem;
  }

  /* Buttons */
  .btn-advance {
    width: 100%;
    padding: 0.75rem;
    border-radius: 0.75rem;
    font-weight: 700;
    color: var(--white);
    font-size: 0.875rem;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-advance.start {
    background: var(--terra);
  }

  .btn-advance.done {
    background: var(--olive);
    margin-bottom: 0.5rem;
  }

  .btn-cancel-order {
    width: 100%;
    padding: 0.625rem;
    border-radius: 0.75rem;
    font-weight: 700;
    color: var(--white);
    font-size: 0.8125rem;
    border: none;
    cursor: pointer;
    font-family: inherit;
    background: var(--wine);
  }

  .ready-label {
    text-align: center;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--olive);
  }

  /* Loading / Empty */
  #loading {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    padding: 5rem 0;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 4px solid var(--terra);
    border-top-color: transparent;
    -webkit-animation: spin 0.8s linear infinite;
    animation: spin 0.8s linear infinite;
  }

  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  #empty-state {
    background: var(--surface);
    border-radius: 1.25rem;
    padding: 4rem 1rem;
    text-align: center;
    border: 1px solid var(--border);
  }

  #empty-state p { font-size: 1.25rem; font-weight: 600; }
  #empty-state small { font-size: 0.875rem; color: var(--ink-soft); }

  /* Error */
  #error-box {
    background: rgba(139,38,53,0.15);
    border: 1px solid var(--wine);
    border-radius: 1rem;
    padding: 1.5rem;
    text-align: center;
    display: none;
  }

  #error-box p { color: var(--ink); font-size: 0.9rem; }
  #retry-btn {
    margin-top: 1rem;
    padding: 0.625rem 1.5rem;
    border-radius: 0.75rem;
    background: var(--terra);
    color: var(--white);
    border: none;
    font-size: 0.875rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div id="header">
  <h1>🍳 Cocina</h1>
  <div id="header-right">
    <span id="order-count">Cargando...</span>
    <span><span id="status-dot"></span><span id="status-text">Conectando...</span></span>
  </div>
</div>

<div id="error-box">
  <p id="error-msg">Error al conectar</p>
  <button id="retry-btn" onclick="init()">Reintentar</button>
</div>

<div id="loading"><div class="spinner"></div></div>

<div id="empty-state" style="display:none">
  <p>Sin órdenes activas</p>
  <small>Las nuevas órdenes aparecerán aquí al instante</small>
</div>

<div id="grid" style="display:none">
  <div class="col col-pending" id="col-pending">
    <div class="col-header">
      <span class="col-label">Pendientes</span>
      <span class="col-badge" id="badge-pending">0</span>
    </div>
    <div id="cards-pending"><div class="col-empty">Sin órdenes</div></div>
  </div>
  <div class="col col-cooking" id="col-cooking">
    <div class="col-header">
      <span class="col-label">En cocina</span>
      <span class="col-badge" id="badge-cooking">0</span>
    </div>
    <div id="cards-cooking"><div class="col-empty">Sin órdenes</div></div>
  </div>
  <div class="col col-ready" id="col-ready">
    <div class="col-header">
      <span class="col-label">Listas</span>
      <span class="col-badge" id="badge-ready">0</span>
    </div>
    <div id="cards-ready"><div class="col-empty">Sin órdenes</div></div>
  </div>
</div>

<script>
// ─── CONFIG ─────────────────────────────────────────────────────────────────
// Estas variables las inyecta el servidor al servir esta página,
// o las puedes hardcodear aquí si el TV no puede leer env vars.
// INSTRUCCIÓN: reemplaza estos valores con los de tu proyecto Supabase.
var SUPABASE_URL = 'https://ifypeslrcdebvdqglywt.supabase.co'
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmeXBlc2xyY2RlYnZkcWdseXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTY3NjYsImV4cCI6MjA5NDg3Mjc2Nn0.MRQYCC_qIkdi32rNGpbE_Z2kKKyTO5d8bPWpatdEI_Q'
// ─────────────────────────────────────────────────────────────────────────────

var orders = []
var timers = {}
var restaurantId = null
var ws = null
var wsHeartbeat = null
var retryTimeout = null

// ─── Helpers ─────────────────────────────────────────────────────────────────
function orderRef(o) {
  return '#' + (o.order_number_today != null ? o.order_number_today : o.id.slice(0, 8))
}

function destinoPedido(o) {
  if (o.table_num) return 'Mesa ' + o.table_num
  if (o.notes && o.notes.split(' · ').indexOf('Barra') !== -1) return 'Barra'
  return o.tipo_pedido || 'Pedido'
}

function parseItems(raw) {
  try {
    var p = typeof raw === 'string' ? JSON.parse(raw) : raw
    return Array.isArray(p) ? p : []
  } catch (e) { return [] }
}

function elapsedStr(createdAt) {
  var diff = Math.floor((Date.now() - new Date(createdAt).getTime()) / 1000)
  var m = Math.floor(diff / 60)
  var s = diff % 60
  return m + ':' + (s < 10 ? '0' + s : s)
}

function isUrgent(createdAt) {
  return (Date.now() - new Date(createdAt).getTime()) / 1000 > 900
}

function esc(str) {
  if (!str) return ''
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
}

// ─── Timers ──────────────────────────────────────────────────────────────────
function startTimers() {
  clearInterval(timers._global)
  timers._global = setInterval(function() {
    var els = document.querySelectorAll('[data-created]')
    for (var i = 0; i < els.length; i++) {
      var el = els[i]
      var ca = el.getAttribute('data-created')
      var urgent = isUrgent(ca)
      el.textContent = elapsedStr(ca)
      if (urgent) {
        el.className = 'card-timer urgent'
        var ul = el.parentNode.querySelector('.urgent-label')
        if (ul) ul.style.display = 'block'
        var card = el.closest('.card')
        if (card) card.className = 'card urgent'
      }
    }
  }, 1000)
}

// ─── Render ──────────────────────────────────────────────────────────────────
function cardHtml(order) {
  var items = parseItems(order.items)
  var urgent = isUrgent(order.created_at)
  var dest = destinoPedido(order)
  var ref = orderRef(order)
  var elapsed = elapsedStr(order.created_at)

  var itemsHtml = ''
  for (var i = 0; i < items.length; i++) {
    var item = items[i]
    if (item.cancelled) continue
    itemsHtml += '<div class="item-row">'
    itemsHtml += '<span class="item-qty">' + esc(item.quantity) + '</span>'
    itemsHtml += '<div><div class="item-name">' + esc(item.name) + '</div>'
    if (item.notes) itemsHtml += '<div class="item-notes">' + esc(item.notes) + '</div>'
    itemsHtml += '</div></div>'
  }

  var notesHtml = ''
  if (order.notes) {
    // Filtrar la nota "Barra" del display de notas
    var filteredNotes = order.notes.split(' · ').filter(function(n) { return n !== 'Barra' }).join(' · ')
    if (filteredNotes) notesHtml = '<div class="card-notes">' + esc(filteredNotes) + '</div>'
  }

  var actionHtml = ''
  if (order.status === 'pending') {
    actionHtml = '<button class="btn-advance start" onclick="advance(\'' + order.id + '\',\'cooking\')">Iniciar preparación</button>'
  } else if (order.status === 'cooking') {
    actionHtml = '<button class="btn-advance done" onclick="advance(\'' + order.id + '\',\'ready\')">Marcar listo</button>'
    actionHtml += '<button class="btn-cancel-order" onclick="cancelOrder(\'' + order.id + '\')">🗑️ Cancelar pedido</button>'
  } else if (order.status === 'ready') {
    actionHtml = '<div class="ready-label">Esperando cobro en caja</div>'
  }

  return '<div class="card' + (urgent ? ' urgent' : '') + '" id="card-' + order.id + '">'
    + '<div class="card-top">'
    + '<div>'
    + '<div class="card-title">' + esc(dest) + (order.customer_name ? ' · ' + esc(order.customer_name) : '') + '</div>'
    + '<div class="card-ref">' + esc(ref) + '</div>'
    + '<span class="paid-badge ' + (order.paid_at ? 'paid' : 'unpaid') + '">' + (order.paid_at ? 'PAGADO' : 'SIN PAGAR') + '</span>'
    + '</div>'
    + '<div>'
    + '<div class="card-timer' + (urgent ? ' urgent' : '') + '" data-created="' + esc(order.created_at) + '">' + elapsed + '</div>'
    + '<div class="urgent-label" style="display:' + (urgent ? 'block' : 'none') + '">¡URGENTE!</div>'
    + '</div>'
    + '</div>'
    + '<div class="items-box">' + itemsHtml + '</div>'
    + notesHtml
    + actionHtml
    + '</div>'
}

function render() {
  var pending = [], cooking = [], ready = []
  for (var i = 0; i < orders.length; i++) {
    var o = orders[i]
    if (o.status === 'pending') pending.push(o)
    else if (o.status === 'cooking') cooking.push(o)
    else if (o.status === 'ready') ready.push(o)
  }

  document.getElementById('loading').style.display = 'none'
  document.getElementById('error-box').style.display = 'none'

  var total = pending.length + cooking.length + ready.length
  document.getElementById('order-count').textContent = total + ' órdenes activas'

  if (total === 0) {
    document.getElementById('grid').style.display = 'none'
    document.getElementById('empty-state').style.display = 'block'
  } else {
    document.getElementById('empty-state').style.display = 'none'
    document.getElementById('grid').style.display = '-webkit-box'
    document.getElementById('grid').style.display = '-ms-flexbox'
    document.getElementById('grid').style.display = 'flex'
  }

  function renderCol(id, badgeId, list) {
    document.getElementById(badgeId).textContent = list.length
    var container = document.getElementById(id)
    if (list.length === 0) {
      container.innerHTML = '<div class="col-empty">Sin órdenes</div>'
    } else {
      var html = ''
      for (var j = 0; j < list.length; j++) html += cardHtml(list[j])
      container.innerHTML = html
    }
  }

  renderCol('cards-pending', 'badge-pending', pending)
  renderCol('cards-cooking', 'badge-cooking', cooking)
  renderCol('cards-ready',   'badge-ready',   ready)

  startTimers()
}

// ─── API calls ───────────────────────────────────────────────────────────────
function apiHeaders() {
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  }
}

function fetchOrders() {
  var url = SUPABASE_URL + '/rest/v1/orders?select=*&status=in.(pending,cooking,ready)&order=created_at.asc'
  var req = new XMLHttpRequest()
  req.open('GET', url, true)
  var headers = apiHeaders()
  for (var k in headers) req.setRequestHeader(k, headers[k])
  req.onload = function() {
    if (req.status >= 200 && req.status < 300) {
      try {
        orders = JSON.parse(req.responseText) || []
        render()
      } catch (e) {
        showError('Error al procesar datos: ' + e.message)
      }
    } else {
      showError('Error HTTP ' + req.status)
    }
  }
  req.onerror = function() { showError('Sin conexión al servidor') }
  req.send()
}

function advance(orderId, nextStatus) {
  var url = SUPABASE_URL + '/rest/v1/orders?id=eq.' + orderId
  var req = new XMLHttpRequest()
  req.open('PATCH', url, true)
  var headers = apiHeaders()
  for (var k in headers) req.setRequestHeader(k, headers[k])
  req.onload = function() { fetchOrders() }
  req.onerror = function() { alert('Error al actualizar pedido') }
  req.send(JSON.stringify({ status: nextStatus }))
}

function cancelOrder(orderId) {
  if (!confirm('¿Cancelar todo el pedido?')) return
  var url = SUPABASE_URL + '/rest/v1/rpc/cancelar_orden'
  var req = new XMLHttpRequest()
  req.open('POST', url, true)
  var headers = apiHeaders()
  for (var k in headers) req.setRequestHeader(k, headers[k])
  req.onload = function() { fetchOrders() }
  req.onerror = function() { alert('Error al cancelar') }
  req.send(JSON.stringify({ p_order_id: orderId }))
}

// ─── Realtime via WebSocket ───────────────────────────────────────────────────
function connectRealtime() {
  if (ws) { try { ws.close() } catch (e) {} }
  clearInterval(wsHeartbeat)

  var wsUrl = SUPABASE_URL.replace('https://', 'wss://').replace('http://', 'ws://')
    + '/realtime/v1/websocket?apikey=' + SUPABASE_ANON_KEY + '&vsn=1.0.0'

  try {
    ws = new WebSocket(wsUrl)
  } catch (e) {
    setStatus('sin realtime', false)
    return
  }

  ws.onopen = function() {
    setStatus('conectado', true)
    // Join channel
    ws.send(JSON.stringify({
      topic: 'realtime:public:orders',
      event: 'phx_join',
      payload: {},
      ref: '1'
    }))
    // Heartbeat cada 30s
    wsHeartbeat = setInterval(function() {
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: '0' }))
      }
    }, 30000)
  }

  ws.onmessage = function(evt) {
    try {
      var msg = JSON.parse(evt.data)
      if (msg.event === 'postgres_changes' || msg.event === 'INSERT' || msg.event === 'UPDATE' || msg.event === 'DELETE') {
        fetchOrders()
      }
    } catch (e) {}
  }

  ws.onclose = function() {
    setStatus('reconectando...', false)
    clearInterval(wsHeartbeat)
    // Reconectar en 5s
    retryTimeout = setTimeout(connectRealtime, 5000)
  }

  ws.onerror = function() {
    setStatus('sin realtime', false)
    // Polling fallback: cada 15s
    setTimeout(function() {
      if (!ws || ws.readyState !== 1) {
        setInterval(fetchOrders, 15000)
      }
    }, 3000)
  }
}

function setStatus(text, ok) {
  document.getElementById('status-text').textContent = text
  document.getElementById('status-dot').style.background = ok ? 'var(--olive)' : 'var(--wine)'
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none'
  document.getElementById('error-box').style.display = 'block'
  document.getElementById('error-msg').textContent = msg
}

// ─── Keep-awake ───────────────────────────────────────────────────────────────
function keepAwake() {
  // 1) Wake Lock API (Chrome 84+, algunos WebOS modernos)
  if ('wakeLock' in navigator) {
    var requestLock = function() {
      navigator.wakeLock.request('screen').catch(function() {})
    }
    requestLock()
    // Re-adquirir si la página vuelve a primer plano
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') requestLock()
    })
  }

  // 2) Video mudo en loop — engaña a browsers viejos que no soportan Wake Lock.
  //    Un video de 1×1px corriendo en loop cuenta como "actividad multimedia"
  //    y evita que el TV apague la pantalla por inactividad.
  try {
    var v = document.createElement('video')
    v.setAttribute('loop', '')
    v.setAttribute('muted', '')
    v.setAttribute('playsinline', '')
    v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0'
    // Vídeo MP4 de 1×1px negro, 1 segundo, codificado en base64

    document.body.appendChild(v)
    v.play().catch(function() {})
  } catch (e) {}

  // 3) Scroll simulado cada 25s — último recurso para TVs muy viejos
  setInterval(function() {
    window.scrollBy(0, 1)
    window.scrollBy(0, -1)
  }, 25000)
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function init() {
  if (SUPABASE_URL === 'REPLACE_WITH_SUPABASE_URL') {
    showError('Configura SUPABASE_URL y SUPABASE_ANON_KEY en este archivo')
    return
  }
  clearTimeout(retryTimeout)
  fetchOrders()
  connectRealtime()
  keepAwake()
}

init()
