<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina — RestaurantOS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #1a1410;
    --surface:  #221c16;
    --border:   #3a2f26;
    --ink:      #f0e8dc;
    --ink-soft: #a89880;
    --terra:    #c4622d;
    --olive:    #5a7a3a;
    --saffron:  #d4963a;
    --wine:     #8b2635;
    --white:    #ffffff;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg:       #f5f0ea;
      --surface:  #ffffff;
      --border:   #ddd5c8;
      --ink:      #1a1410;
      --ink-soft: #6b5a48;
      --terra:    #c4622d;
      --olive:    #4a6a2a;
      --saffron:  #b8820a;
      --wine:     #8b2635;
      --white:    #ffffff;
    }
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, Arial, sans-serif;
    height: 100%;
    max-height: 100vh;
    overflow: hidden;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -ms-flex-direction: column;
    flex-direction: column;
    padding: 6px 8px 0;
    font-size: 13px;
  }

  /* ── Header ── */
  #header {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--border);
    -ms-flex-negative: 0;
    flex-shrink: 0;
  }

  #header h1 { font-size: 15px; font-weight: 700; }

  #header-right {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    gap: 0.875rem;
  }

  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--olive);
    display: inline-block;
    margin-right: 5px;
  }

  #status-text, #order-count { font-size: 11px; color: var(--ink-soft); }

  /* ── Grid ── */
  #grid {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    gap: 6px;
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    overflow: hidden;
    padding: 5px 0 0;
    min-height: 0;
  }

  .col {
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    border-radius: 10px;
    padding: 6px;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -ms-flex-direction: column;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  .col-pending { background: rgba(212,150,58,0.10); border: 1px solid rgba(212,150,58,0.30); }
  .col-cooking { background: rgba(196,98,45,0.10);  border: 1px solid rgba(196,98,45,0.30); }
  .col-ready   { background: rgba(90,122,58,0.10);  border: 1px solid rgba(90,122,58,0.30); }

  .col-header {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;
    margin-bottom: 5px;
    -ms-flex-negative: 0;
    flex-shrink: 0;
  }

  .col-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .col-pending .col-label { color: var(--saffron); }
  .col-cooking .col-label { color: var(--terra); }
  .col-ready   .col-label { color: var(--olive); }

  .col-badge {
    border-radius: 999px;
    min-width: 18px; height: 18px;
    padding: 0 4px;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--white);
  }

  .col-pending .col-badge { background: var(--saffron); }
  .col-cooking .col-badge { background: var(--terra); }
  .col-ready   .col-badge { background: var(--olive); }

  /* Scrollable cards area */
  .col-cards {
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
  }

  .col-empty {
    text-align: center;
    padding: 1.5rem 0;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }

  /* ── Order Card — compacta para caber 3 en pantalla ── */
  .card {
    background: var(--surface);
    border-radius: 8px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    margin-bottom: 5px;
  }

  .card.urgent { border-color: var(--wine); border-width: 2px; }

  .card-top {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;
    margin-bottom: 5px;
  }

  .card-title { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.2; }
  .card-ref   { font-size: 10px; color: var(--ink-soft); }

  .paid-badge {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 999px;
    font-size: 9px;
    font-weight: 700;
    color: var(--white);
  }
  .paid-badge.paid   { background: var(--olive); }
  .paid-badge.unpaid { background: var(--wine); }

  .card-timer { font-size: 13px; font-weight: 700; text-align: right; color: var(--ink-soft); }
  .card-timer.urgent { color: var(--wine); }
  .urgent-label { font-size: 9px; font-weight: 800; color: var(--wine); text-align: right; }

  .items-box {
    background: var(--bg);
    border-radius: 6px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    margin-bottom: 5px;
  }

  .item-row {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }
  .item-row:last-child { margin-bottom: 0; }

  .item-qty {
    min-width: 28px; height: 28px;
    padding: 0 5px;
    border-radius: 6px;
    background: var(--terra);
    color: var(--white);
    font-size: 14px;
    font-weight: 700;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    -ms-flex-negative: 0;
    flex-shrink: 0;
  }

  .item-name  { font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .item-notes { font-size: 10px; color: var(--saffron); font-weight: 600; }

  .card-notes {
    font-size: 10px;
    color: var(--ink-soft);
    background: var(--bg);
    border-radius: 4px;
    padding: 3px 6px;
    border: 1px solid var(--border);
    margin-bottom: 5px;
  }

  .btn-advance {
    width: 100%;
    padding: 5px;
    border-radius: 6px;
    font-weight: 700;
    color: var(--white);
    font-size: 11px;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-advance.start { background: var(--terra); }
  .btn-advance.done  { background: var(--olive); margin-bottom: 4px; }

  .btn-cancel-order {
    width: 100%;
    padding: 4px;
    border-radius: 6px;
    font-weight: 700;
    color: var(--white);
    font-size: 10px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    background: var(--wine);
  }

  .ready-label {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--olive);
  }

  /* ── Ticker inferior ── */
  #ticker-wrap {
    -ms-flex-negative: 0;
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    overflow: hidden;
    height: 30px;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
  }

  #ticker-label {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--saffron);
    text-transform: uppercase;
    padding: 0 8px;
    -ms-flex-negative: 0;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    height: 100%;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
  }

  #ticker-track {
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    overflow: hidden;
    height: 100%;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
  }

  #ticker-inner {
    display: -webkit-inline-box;
    display: -ms-inline-flexbox;
    display: inline-flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    white-space: nowrap;
    -webkit-animation: ticker-scroll 30s linear infinite;
    animation: ticker-scroll 30s linear infinite;
    padding-left: 100%;
  }

  @-webkit-keyframes ticker-scroll {
    0%   { -webkit-transform: translateX(0); }
    100% { -webkit-transform: translateX(-100%); }
  }
  @keyframes ticker-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  .ticker-item {
    display: -webkit-inline-box;
    display: -ms-inline-flexbox;
    display: inline-flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    gap: 0.375rem;
    font-size: 0.8125rem;
  }

  .ticker-qty {
    background: var(--terra);
    color: var(--white);
    font-weight: 800;
    border-radius: 4px;
    padding: 0 5px;
    font-size: 12px;
  }

  .ticker-name { color: var(--ink); font-weight: 600; font-size: 12px; }
  .ticker-sep  { color: var(--ink-soft); font-size: 14px; }

  /* Loading / Empty */
  #loading {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
  }

  .spinner {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 3px solid var(--terra);
    border-top-color: transparent;
    -webkit-animation: spin 0.8s linear infinite;
    animation: spin 0.8s linear infinite;
  }

  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  #empty-state {
    background: var(--surface);
    border-radius: 1rem;
    padding: 3rem 1rem;
    text-align: center;
    border: 1px solid var(--border);
    margin: 0.625rem 0;
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    display: none;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -ms-flex-direction: column;
    flex-direction: column;
    gap: 0.5rem;
  }

  #empty-state p     { font-size: 1.125rem; font-weight: 600; }
  #empty-state small { font-size: 0.8125rem; color: var(--ink-soft); }

  #error-box {
    background: rgba(139,38,53,0.15);
    border: 1px solid var(--wine);
    border-radius: 0.875rem;
    padding: 1.25rem;
    text-align: center;
    display: none;
    margin: 0.625rem 0;
  }

  #error-box p { color: var(--ink); font-size: 0.875rem; }

  #retry-btn {
    margin-top: 0.75rem;
    padding: 0.5rem 1.25rem;
    border-radius: 0.625rem;
    background: var(--terra);
    color: var(--white);
    border: none;
    font-size: 0.8125rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div id="header">
  <h1>🍳 Cocina</h1>
  <div id="header-right">
    <span id="order-count">Cargando...</span>
    <span><span id="status-dot"></span><span id="status-text">Conectando...</span></span>
  </div>
</div>

<div id="error-box">
  <p id="error-msg">Error al conectar</p>
  <button id="retry-btn" onclick="init()">Reintentar</button>
</div>

<div id="loading"><div class="spinner"></div></div>

<div id="empty-state">
  <p>Sin órdenes activas</p>
  <small>Las nuevas órdenes aparecerán aquí al instante</small>
</div>

<div id="grid" style="display:none">
  <div class="col col-pending">
    <div class="col-header">
      <span class="col-label">Pendientes</span>
      <span class="col-badge" id="badge-pending">0</span>
    </div>
    <div class="col-cards" id="cards-pending"><div class="col-empty">Sin órdenes</div></div>
  </div>
  <div class="col col-cooking">
    <div class="col-header">
      <span class="col-label">En cocina</span>
      <span class="col-badge" id="badge-cooking">0</span>
    </div>
    <div class="col-cards" id="cards-cooking"><div class="col-empty">Sin órdenes</div></div>
  </div>
  <div class="col col-ready">
    <div class="col-header">
      <span class="col-label">Listas</span>
      <span class="col-badge" id="badge-ready">0</span>
    </div>
    <div class="col-cards" id="cards-ready"><div class="col-empty">Sin órdenes</div></div>
  </div>
</div>

<div id="ticker-wrap" style="display:none">
  <div id="ticker-label">Total activo</div>
  <div id="ticker-track">
    <div id="ticker-inner"></div>
  </div>
</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
var SUPABASE_URL = 'https://ifypeslrcdebvdqglywt.supabase.co'
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmeXBlc2xyY2RlYnZkcWdseXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTY3NjYsImV4cCI6MjA5NDg3Mjc2Nn0.MRQYCC_qIkdi32rNGpbE_Z2kKKyTO5d8bPWpatdEI_Q'
// ─────────────────────────────────────────────────────────────────────────────

var orders = []
var timers = {}
var ws = null
var wsHeartbeat = null
var retryTimeout = null

// ─── Helpers ─────────────────────────────────────────────────────────────────
function orderRef(o) {
  return '#' + (o.order_number_today != null ? o.order_number_today : o.id.slice(0, 8))
}

function destinoPedido(o) {
  if (o.table_num) return 'Mesa ' + o.table_num
  if (o.notes && o.notes.split(' · ').indexOf('Barra') !== -1) return 'Barra'
  return o.tipo_pedido || 'Pedido'
}

function parseItems(raw) {
  try {
    var p = typeof raw === 'string' ? JSON.parse(raw) : raw
    return Array.isArray(p) ? p : []
  } catch (e) { return [] }
}

function elapsedStr(createdAt) {
  var diff = Math.floor((Date.now() - new Date(createdAt).getTime()) / 1000)
  var m = Math.floor(diff / 60), s = diff % 60
  return m + ':' + (s < 10 ? '0' + s : s)
}

function isUrgent(createdAt) {
  return (Date.now() - new Date(createdAt).getTime()) / 1000 > 900
}

function esc(str) {
  if (!str) return ''
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// ─── Ticker — agrupa ítems de todas las órdenes activas ──────────────────────
function buildTicker() {
  // Contar todos los ítems activos (pending + cooking + ready)
  var counts = {}
  for (var i = 0; i < orders.length; i++) {
    var items = parseItems(orders[i].items)
    for (var j = 0; j < items.length; j++) {
      var it = items[j]
      if (it.cancelled) continue
      var key = it.name
      counts[key] = (counts[key] || 0) + (it.quantity || 1)
    }
  }

  var keys = []
  for (var k in counts) keys.push(k)

  var wrap = document.getElementById('ticker-wrap')
  var inner = document.getElementById('ticker-inner')

  if (keys.length === 0) {
    wrap.style.display = 'none'
    return
  }

  wrap.style.display = 'flex'

  // Ordenar de mayor a menor cantidad
  keys.sort(function(a, b) { return counts[b] - counts[a] })

  var html = ''
  for (var n = 0; n < keys.length; n++) {
    if (n > 0) html += '<span class="ticker-sep"> &nbsp;·&nbsp; </span>'
    html += '<span class="ticker-item">'
      + '<span class="ticker-qty">' + counts[keys[n]] + 'x</span>'
      + '&nbsp;<span class="ticker-name">' + esc(keys[n]) + '</span>'
      + '</span>'
  }
  inner.innerHTML = html

  // Velocidad: más ítems = más tiempo para que se lea todo
  var duration = Math.max(15, keys.length * 5) + 's'
  inner.style.WebkitAnimationDuration = duration
  inner.style.animationDuration = duration
}

// ─── Timers ──────────────────────────────────────────────────────────────────
function startTimers() {
  clearInterval(timers._global)
  timers._global = setInterval(function() {
    var els = document.querySelectorAll('[data-created]')
    for (var i = 0; i < els.length; i++) {
      var el = els[i]
      var ca = el.getAttribute('data-created')
      el.textContent = elapsedStr(ca)
      if (isUrgent(ca)) {
        el.className = 'card-timer urgent'
        var ul = el.parentNode.querySelector('.urgent-label')
        if (ul) ul.style.display = 'block'
        var card = el.closest ? el.closest('.card') : null
        if (card) card.className = 'card urgent'
      }
    }
  }, 1000)
}

// ─── Render ──────────────────────────────────────────────────────────────────
function cardHtml(order) {
  var items = parseItems(order.items)
  var urgent = isUrgent(order.created_at)

  var itemsHtml = ''
  for (var i = 0; i < items.length; i++) {
    var item = items[i]
    if (item.cancelled) continue
    itemsHtml += '<div class="item-row">'
      + '<span class="item-qty">' + esc(item.quantity) + '</span>'
      + '<div><div class="item-name">' + esc(item.name) + '</div>'
      + (item.notes ? '<div class="item-notes">' + esc(item.notes) + '</div>' : '')
      + '</div></div>'
  }

  var notesHtml = ''
  if (order.notes) {
    var fn = order.notes.split(' · ').filter(function(n) { return n !== 'Barra' }).join(' · ')
    if (fn) notesHtml = '<div class="card-notes">' + esc(fn) + '</div>'
  }

  var actionHtml = ''
  if (order.status === 'pending') {
    actionHtml = '<button class="btn-advance start" onclick="advance(\'' + order.id + '\',\'cooking\')">Iniciar preparación</button>'
  } else if (order.status === 'cooking') {
    actionHtml = '<button class="btn-advance done" onclick="advance(\'' + order.id + '\',\'ready\')">Marcar listo</button>'
      + '<button class="btn-cancel-order" onclick="cancelOrder(\'' + order.id + '\')">🗑️ Cancelar</button>'
  } else if (order.status === 'ready') {
    actionHtml = '<div class="ready-label">Esperando cobro en caja</div>'
  }

  var dest = destinoPedido(order)
  var ref  = orderRef(order)

  return '<div class="card' + (urgent ? ' urgent' : '') + '">'
    + '<div class="card-top">'
    + '<div>'
    + '<div class="card-title">' + esc(dest) + (order.customer_name ? ' · ' + esc(order.customer_name) : '') + '</div>'
    + '<div class="card-ref">' + esc(ref) + '</div>'
    + '<span class="paid-badge ' + (order.paid_at ? 'paid' : 'unpaid') + '">' + (order.paid_at ? 'PAGADO' : 'SIN PAGAR') + '</span>'
    + '</div>'
    + '<div>'
    + '<div class="card-timer' + (urgent ? ' urgent' : '') + '" data-created="' + esc(order.created_at) + '">' + elapsedStr(order.created_at) + '</div>'
    + '<div class="urgent-label" style="display:' + (urgent ? 'block' : 'none') + '">¡URGENTE!</div>'
    + '</div>'
    + '</div>'
    + '<div class="items-box">' + itemsHtml + '</div>'
    + notesHtml
    + actionHtml
    + '</div>'
}

function render() {
  var pending = [], cooking = [], ready = []
  for (var i = 0; i < orders.length; i++) {
    var o = orders[i]
    if      (o.status === 'pending') pending.push(o)
    else if (o.status === 'cooking') cooking.push(o)
    else if (o.status === 'ready')   ready.push(o)
  }

  document.getElementById('loading').style.display = 'none'
  document.getElementById('error-box').style.display = 'none'

  var total = pending.length + cooking.length + ready.length
  document.getElementById('order-count').textContent = total + ' órdenes activas'

  if (total === 0) {
    document.getElementById('grid').style.display = 'none'
    document.getElementById('ticker-wrap').style.display = 'none'
    document.getElementById('empty-state').style.display = '-webkit-box'
    document.getElementById('empty-state').style.display = '-ms-flexbox'
    document.getElementById('empty-state').style.display = 'flex'
  } else {
    document.getElementById('empty-state').style.display = 'none'
    document.getElementById('grid').style.display = '-webkit-box'
    document.getElementById('grid').style.display = '-ms-flexbox'
    document.getElementById('grid').style.display = 'flex'
    buildTicker()
  }

  function renderCol(id, badgeId, list) {
    document.getElementById(badgeId).textContent = list.length
    var container = document.getElementById(id)
    if (list.length === 0) {
      container.innerHTML = '<div class="col-empty">Sin órdenes</div>'
    } else {
      var html = ''
      for (var j = 0; j < list.length; j++) html += cardHtml(list[j])
      container.innerHTML = html
    }
  }

  renderCol('cards-pending', 'badge-pending', pending)
  renderCol('cards-cooking', 'badge-cooking', cooking)
  renderCol('cards-ready',   'badge-ready',   ready)

  startTimers()
}

// ─── API ─────────────────────────────────────────────────────────────────────
function apiHeaders() {
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  }
}

function fetchOrders() {
  var url = SUPABASE_URL + '/rest/v1/orders?select=*&status=in.%28pending%2Ccooking%2Cready%29&order=created_at.asc'
  var req = new XMLHttpRequest()
  req.open('GET', url, true)
  var h = apiHeaders()
  for (var k in h) req.setRequestHeader(k, h[k])
  req.onload = function() {
    if (req.status >= 200 && req.status < 300) {
      try { orders = JSON.parse(req.responseText) || []; render() }
      catch (e) { showError('Error al procesar datos') }
    } else { showError('Error HTTP ' + req.status) }
  }
  req.onerror = function() { showError('Sin conexión al servidor') }
  req.send()
}

function advance(orderId, nextStatus) {
  var req = new XMLHttpRequest()
  req.open('PATCH', SUPABASE_URL + '/rest/v1/orders?id=eq.' + orderId, true)
  var h = apiHeaders()
  for (var k in h) req.setRequestHeader(k, h[k])
  req.onload = function() { fetchOrders() }
  req.onerror = function() { alert('Error al actualizar pedido') }
  req.send(JSON.stringify({ status: nextStatus }))
}

function cancelOrder(orderId) {
  if (!confirm('¿Cancelar todo el pedido?')) return
  var req = new XMLHttpRequest()
  req.open('POST', SUPABASE_URL + '/rest/v1/rpc/cancelar_orden', true)
  var h = apiHeaders()
  for (var k in h) req.setRequestHeader(k, h[k])
  req.onload = function() { fetchOrders() }
  req.onerror = function() { alert('Error al cancelar') }
  req.send(JSON.stringify({ p_order_id: orderId }))
}

// ─── Polling — fuente principal de actualizaciones ───────────────────────────
var pollInterval = null
function startPolling() {
  if (pollInterval) clearInterval(pollInterval)
  pollInterval = setInterval(fetchOrders, 8000)
}

// ─── Realtime — bonus encima del polling, no reemplaza ───────────────────────
function connectRealtime() {
  if (ws) { try { ws.close() } catch (e) {} }
  clearInterval(wsHeartbeat)

  var wsUrl = SUPABASE_URL.replace('https://','wss://').replace('http://','ws://')
    + '/realtime/v1/websocket?apikey=' + SUPABASE_ANON_KEY + '&vsn=1.0.0'

  try { ws = new WebSocket(wsUrl) } catch (e) { setStatus('polling', true); return }

  ws.onopen = function() {
    setStatus('tiempo real', true)
    ws.send(JSON.stringify({
      topic: 'realtime:public:orders',
      event: 'phx_join',
      payload: { config: { broadcast: { self: true }, postgres_changes: [{ event: '*', schema: 'public', table: 'orders' }] } },
      ref: '1'
    }))
    wsHeartbeat = setInterval(function() {
      if (ws && ws.readyState === 1)
        ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: '0' }))
    }, 25000)
  }

  ws.onmessage = function(evt) {
    try {
      var msg = JSON.parse(evt.data)
      if (msg.event === 'postgres_changes' || msg.event === 'INSERT' || msg.event === 'UPDATE' || msg.event === 'DELETE')
        fetchOrders()
    } catch (e) {}
  }

  ws.onclose = function() {
    setStatus('polling', true)
    clearInterval(wsHeartbeat)
    retryTimeout = setTimeout(connectRealtime, 10000)
  }

  ws.onerror = function() {
    setStatus('polling', true)
  }
}

function setStatus(text, ok) {
  document.getElementById('status-text').textContent = text
  document.getElementById('status-dot').style.background = ok ? 'var(--olive)' : 'var(--wine)'
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none'
  document.getElementById('error-box').style.display = 'block'
  document.getElementById('error-msg').textContent = msg
}

// ─── Keep-awake ───────────────────────────────────────────────────────────────

  // 1. Wake Lock API (Chrome 84+, no disponible en WebOS 79)
  if ('wakeLock' in navigator) {
    var requestLock = function() { navigator.wakeLock.request('screen').catch(function() {}) }
    requestLock()
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') requestLock()
    })
  }

  // 2. Video mudo en loop (mantiene actividad de media)
  try {
    var v = document.createElement('video')
    v.setAttribute('loop',''); v.setAttribute('muted',''); v.setAttribute('playsinline','')
    v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0'
    v.src = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAA0NtZGF0AAACrAYF//+p3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE0MiByMjM4OSA5NTZjOGQ4IC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAxNCAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbCAtIG9wdGlvbnM6IGNhYmFjPTEgcmVmPTMgZGVibG9jaz0xOjA6MCBhbmFseXNlPTB4MzoweDExMyBtZT1oZXggc3VibWU9NyBwc3k9MSBwc3lfcmQ9MS4wMDowLjAwIG1peGVkX3JlZj0xIG1lX3JhbmdlPTE2IGNocm9tYV9tZT0xIHRyZWxsaXM9MSA4eDhkY3Q9MSBjcW09MCBkZWFkem9uZT0yMSwxMSBmYXN0X3Bza2lwPTEgY2hyb21hX3FwX29mZnNldD0tMiBicmFtZXM9MyBvcGVuX2dvcD0wIHdlaWdodHA9MiByZWxsb2M9MSB3ZWlnaHRiPTEga2V5aW50PTI1MCBrZXlpbnRfbWluPTI1IHNjZW5lY3V0PTQwIGludHJhX3JlZnJlc2g9MCByY19sb29rYWhlYWQ9NDAgcmM9Y3JmIG1idHJlZT0xIGNyZj0yMy4wIHFjb21wPTAuNjAgcXBtaW49MCBxcG1heD02OSBxcHN0ZXA9NCBpcF9yYXRpbz0xLjQwIGFxPTE6MS4wMACAAAAAD2WIhAA3//728P4FNjuaAAAABWWIhAA='
    document.body.appendChild(v)
    v.play().catch(function() {})
  } catch (e) {}

  // 3. Scroll micro — simula actividad en la página
  setInterval(function() { window.scrollBy(0,1); window.scrollBy(0,-1) }, 20000)

  // 4. Click invisible — método más agresivo para engañar a WebOS
  // Dispara un evento de input sintético cada 15s en un elemento oculto
  var ghost = document.createElement('input')
  ghost.style.cssText = 'position:fixed;opacity:0;width:1px;height:1px;top:0;left:0;pointer-events:none'
  ghost.setAttribute('readonly', '')
  document.body.appendChild(ghost)
  setInterval(function() {
    try {
      ghost.focus()
      ghost.blur()
      // MouseEvent sintético — cuenta como interacción de usuario en WebOS
      var evt = document.createEvent('MouseEvents')
      evt.initMouseEvent('mousemove', true, true, window, 0, 1, 1, 1, 1, false, false, false, false, 0, null)
      document.dispatchEvent(evt)
    } catch (e) {}
  }, 15000)
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function init() {
  clearTimeout(retryTimeout)
  fetchOrders()
  startPolling()      // polling cada 8s siempre, sin importar WebSocket
  connectRealtime()   // WebSocket encima del polling como bonus
  keepAwake()
}

init()
</script>
