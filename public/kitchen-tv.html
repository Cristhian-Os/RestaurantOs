<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina — RestaurantOS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Tema base: azul noche (default para TV de cocina).
     Todo el tamaño va en rem y el rem escala con el ancho de pantalla:
     16px a 1920px de ancho, así se ve igual en cualquier TV. */
  :root {
    --bg:        #000000;
    --surface:   #0C0C0E;
    --card:      #17171B;
    --card-line: #2B2B31;
    --inset:     #050506;
    --ink:       #F5F5F7;
    --ink-soft:  #A0A0AA;
    --ink-note:  #D6D6DC;
    --pend:      #FB923C;
    --cook:      #E879F9;
    --ready:     #34D399;
    --warn:      #FBBF24;
    --late:      #F43F5E;
    --late-bg:   #BE123C;
    --paid-bg:   #FB923C;
    --paid-fg:   #1A1100;
    --unpaid-fg: #FBBF24;
    --alert-bg:  rgba(251,191,36,0.15);
    --alert-fg:  #FDE68A;
    --white:     #FFFFFF;
  }

  /* El tema lo decide SOLO el restaurante (restaurant_config) o ?theme=. Se ignora
     prefers-color-scheme: las TVs WebOS lo reportan como "light" y pisaban el oscuro. */
  html[data-theme="light"] {
    --bg:        #F4EEE4;
    --surface:   #FBF6EE;
    --card:      #FDFAF4;
    --card-line: #E3D9C8;
    --inset:     #EFE6D6;
    --ink:       #2B2018;
    --ink-soft:  #5C5147;
    --ink-note:  #3A2F25;
    --pend:      #C2570C;
    --cook:      #A21CAF;
    --ready:     #047857;
    --warn:      #B45309;
    --late:      #E11D48;
    --late-bg:   #BE123C;
    --paid-bg:   #FDBA74;
    --paid-fg:   #431407;
    --unpaid-fg: #92400E;
    --alert-bg:  #FEF3C7;
    --alert-fg:  #78350F;
  }

  html { font-size: 0.8333vw; height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    height: 100%;
    max-height: 100vh;
    overflow: hidden;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -ms-flex-direction: column;
    flex-direction: column;
    font-size: 1rem;
  }

  /* ── Aviso de sonido bloqueado ── */
  #sound-banner {
    display: none;
    -ms-flex-negative: 0;
    flex-shrink: 0;
    width: 100%;
    border: none;
    cursor: pointer;
    background: var(--warn);
    color: #1A1100;
    font-family: inherit;
    font-size: 1.75rem;
    font-weight: 800;
    padding: 0.625rem 1.5rem;
    text-align: center;
  }

  /* ── Header ── */
  #header {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;
    height: 4rem;
    padding: 0 2rem;
    -ms-flex-negative: 0;
    flex-shrink: 0;
  }

  #header h1 { font-size: 2.25rem; font-weight: 800; }

  #header-right {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    font-size: 1.75rem;
    font-weight: 700;
  }

  #header-right > * { margin-left: 1.75rem; }

  #status-dot {
    width: 1rem; height: 1rem;
    border-radius: 50%;
    background: var(--ready);
    display: inline-block;
    margin-right: 0.625rem;
  }

  #status-text { color: var(--ready); }

  #new-flash {
    display: none;
    background: var(--cook);
    color: #12001A;
    font-size: 1.75rem;
    font-weight: 800;
    border-radius: 999px;
    padding: 0.125rem 1.25rem;
  }

  #test-sound {
    font-family: inherit;
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--surface);
    border: 0.125rem solid var(--card-line);
    border-radius: 999px;
    padding: 0.25rem 1rem;
    cursor: pointer;
  }

  /* ── Columnas ── */
  #grid {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding: 0.25rem 1.5rem 0.875rem;
  }

  .col {
    min-width: 0;
    min-height: 0;
    padding: 0.875rem;
    border-radius: 1.75rem;
    border: 0.1875rem solid;
    background: var(--surface);
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -ms-flex-direction: column;
    flex-direction: column;
    overflow: hidden;
  }

  .col + .col { margin-left: 1.25rem; }

  .col-pending { -webkit-box-flex: 38; -ms-flex: 38 1 0px; flex: 38 1 0px; border-color: var(--pend); }
  .col-cooking { -webkit-box-flex: 38; -ms-flex: 38 1 0px; flex: 38 1 0px; border-color: var(--cook); }
  .col-ready   { -webkit-box-flex: 24; -ms-flex: 24 1 0px; flex: 24 1 0px; border-color: var(--ready); }

  .col-header {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;
    height: 3rem;
    margin-bottom: 0.75rem;
    -ms-flex-negative: 0;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .col-title { display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-align: baseline; -ms-flex-align: baseline; align-items: baseline; min-width: 0; }
  .col-label { font-size: 2.125rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
  .col-hint  { font-size: 1.1875rem; font-weight: 600; color: var(--ink-soft); margin-left: 0.875rem; }
  .col-right { display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-align: center; -ms-flex-align: center; align-items: center; }

  .col-pending .col-label { color: var(--pend); }
  .col-cooking .col-label { color: var(--cook); }
  .col-ready   .col-label { color: var(--ready); }

  .col-extra { display: none; font-size: 1.5rem; font-weight: 800; margin-right: 0.625rem; }

  .col-badge {
    width: 3rem; height: 3rem;
    border-radius: 50%;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    font-size: 1.75rem;
    font-weight: 800;
    color: #0A0A0A;
  }

  .col-pending .col-badge { background: var(--pend); }
  .col-cooking .col-badge { background: var(--cook); }
  .col-ready   .col-badge { background: var(--ready); }

  /* Área de tarjetas: nunca scrollea. Lo que no cabe se oculta y se cuenta en "+N más",
     así ninguna tarjeta se ve cortada a la mitad. */
  .col-cards {
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -ms-flex-wrap: wrap;
    flex-wrap: wrap;
    -ms-flex-line-pack: start;
    align-content: flex-start;
  }

  .col-empty {
    width: 100%;
    text-align: center;
    padding: 2rem 0;
    font-size: 1.875rem;
    font-weight: 500;
    color: var(--ink-soft);
  }

  /* ── Tarjeta de orden ── */
  .card {
    width: calc(50% - 0.3125rem);
    margin-bottom: 0.625rem;
    padding: 0.625rem;
    border-radius: 1rem;
    border: 0.1875rem solid var(--card-line);
    background: var(--card);
    cursor: default;
    outline: none;
  }

  .card:nth-child(odd) { margin-right: 0.625rem; }

  .card.clickable { cursor: pointer; }
  .card.clickable:hover { -webkit-filter: brightness(1.2); filter: brightness(1.2); }
  .card.clickable:active { -webkit-transform: scale(0.97); transform: scale(0.97); }
  .card.clickable:focus { border-color: var(--white); }
  .card.late { border-color: var(--late); }

  /* Listas: una sola columna, tarjeta compacta */
  .col-ready .card { width: 100%; margin-right: 0; padding: 0.5rem 0.625rem; }
  .col-ready .card:nth-child(odd) { margin-right: 0; }

  .row1 {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;
  }

  .title { -webkit-box-flex: 1; -ms-flex: 1; flex: 1; min-width: 0; font-size: 1.75rem; font-weight: 800; line-height: 1.1; word-wrap: break-word; padding-right: 0.5rem; }

  .timer {
    -ms-flex-negative: 0;
    flex-shrink: 0;
    font-size: 2.125rem;
    font-weight: 800;
    line-height: 1;
    padding: 0.125rem 0.5rem;
    border-radius: 0.625rem;
  }
  .timer.t-ok    { color: var(--pend); }
  .timer.t-warn  { color: var(--warn); }
  .timer.t-late  { color: var(--white); background: var(--late-bg); }
  .timer.t-ready { color: var(--ready); }

  .row2 {
    -ms-flex-wrap: wrap;
    flex-wrap: wrap;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;
    margin-top: 0.3125rem;
  }

  .sub { white-space: nowrap; font-size: 1.125rem; font-weight: 800; letter-spacing: 0.03em; color: var(--pend); text-transform: uppercase; }

  .badge {
    display: inline-block;
    font-size: 0.875rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 0.0625rem 0.625rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.paid   { background: var(--paid-bg); color: var(--paid-fg); }
  .badge.unpaid { background: var(--inset); color: var(--unpaid-fg); border: 0.0625rem solid var(--unpaid-fg); }

  .btn-cancel {
    margin-left: 0.5rem;
    font-family: inherit;
    font-size: 0.875rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--white);
    background: var(--late-bg);
    border: none;
    border-radius: 999px;
    padding: 0.0625rem 0.625rem;
    cursor: pointer;
  }

  .alert {
    margin-top: 0.3125rem;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.2;
    color: var(--alert-fg);
    background: var(--alert-bg);
    border-radius: 0.5rem;
    padding: 0.1875rem 0.5rem;
    word-wrap: break-word;
  }

  .items {
    margin-top: 0.3125rem;
    padding: 0.3125rem 0.5rem;
    border-radius: 0.625rem;
    background: var(--inset);
  }

  .item { padding: 0.125rem 0.5rem 0.125rem 0.125rem; border-radius: 0.625rem; }
  .item + .item { margin-top: 0.1875rem; }

  .item-main { display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-align: center; -ms-flex-align: center; align-items: center; }

  .item-qty {
    width: 1.875rem; height: 1.875rem;
    -ms-flex-negative: 0;
    flex-shrink: 0;
    border-radius: 50%;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    font-size: 1.25rem;
    font-weight: 800;
    margin-right: 0.625rem;
  }

  .item-name  { -webkit-box-flex: 1; -ms-flex: 1; flex: 1; min-width: 0; font-size: 1.625rem; font-weight: 700; line-height: 1.15; word-wrap: break-word; }
  .item-notes { margin-left: 2.5rem; font-size: 1.25rem; font-weight: 500; line-height: 1.2; color: var(--ink-note); word-wrap: break-word; }

  /* Listas: los productos van en fichas que se acomodan en líneas */
  .chips { margin-top: 0.25rem; display: -webkit-box; display: -ms-flexbox; display: flex; -ms-flex-wrap: wrap; flex-wrap: wrap; }
  .chip {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    margin: 0 0.375rem 0.375rem 0;
    padding: 0.125rem 0.75rem 0.125rem 0.125rem;
    border-radius: 0.625rem;
  }
  .chip .item-qty { width: 1.75rem; height: 1.75rem; font-size: 1.1875rem; margin-right: 0.5rem; }
  .chip-text { font-size: 1.375rem; font-weight: 600; line-height: 1.15; }

  .ready-hint { margin-top: 0.125rem; font-size: 1rem; font-weight: 600; color: var(--ink-soft); }


  /* Modo denso: se activa solo en una columna cuando las órdenes no caben con el tamaño normal. */
  .col.dense .card { padding: 0.4375rem 0.5rem; margin-bottom: 0.4375rem; border-width: 0.125rem; }
  .col.dense .title { font-size: 1.5rem; }
  .col.dense .timer { font-size: 1.75rem; padding: 0 0.4375rem; }
  .col.dense .row2 { margin-top: 0.125rem; }
  .col.dense .sub { font-size: 1rem; }
  .col.dense .badge, .col.dense .btn-cancel { font-size: 0.8125rem; padding: 0 0.5rem; }
  .col.dense .alert { font-size: 1.125rem; margin-top: 0.1875rem; padding: 0.125rem 0.4375rem; }
  .col.dense .items { margin-top: 0.1875rem; padding: 0.1875rem 0.375rem; }
  .col.dense .item { padding: 0 0.375rem 0 0.125rem; }
  .col.dense .item + .item { margin-top: 0.125rem; }
  .col.dense .item-qty { width: 1.625rem; height: 1.625rem; font-size: 1.125rem; margin-right: 0.5rem; }
  .col.dense .item-name { font-size: 1.4375rem; }
  .col.dense .item-notes { margin-left: 2.125rem; font-size: 1.125rem; line-height: 1.15; }
  .col.dense .chip { margin-bottom: 0.25rem; }
  .col.dense .chip-text { font-size: 1.1875rem; }
  .col.dense .chip .item-qty { width: 1.5rem; height: 1.5rem; font-size: 1rem; }
  .col.dense .ready-hint { display: none; }

  /* ── Total activo ── */
  /* TOTAL ACTIVO: franja inferior que corre como el ticker de un noticiero */
  #totals {
    -ms-flex-negative: 0;
    flex-shrink: 0;
    height: 3.25rem;
    overflow: hidden;
    padding: 0 0 0 1.5rem;
    background: var(--surface);
    border-top: 0.125rem solid var(--card-line);
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
  }
  #totals-label { font-size: 1.125rem; font-weight: 800; letter-spacing: 0.06em; color: var(--ink-soft); white-space: nowrap; margin-right: 1.25rem; -ms-flex-negative: 0; flex-shrink: 0; }
  #totals-list { -webkit-box-flex: 1; -ms-flex: 1; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
  #totals-track { display: inline-block; white-space: nowrap; will-change: transform; -webkit-animation: tvtick 30s linear infinite; animation: tvtick 30s linear infinite; }
  @-webkit-keyframes tvtick { from { -webkit-transform: translate3d(0,0,0); } to { -webkit-transform: translate3d(-50%,0,0); } }
  @keyframes tvtick { from { transform: translate3d(0,0,0); } to { transform: translate3d(-50%,0,0); } }
  .total-chip { display: inline-block; vertical-align: middle; margin: 0 1.75rem 0 0; white-space: nowrap; }
  .total-qty {
    display: inline-block; vertical-align: middle;
    min-width: 2rem; height: 2rem; line-height: 2rem; text-align: center;
    padding: 0 0.375rem; border-radius: 1rem;
    font-size: 1.25rem; font-weight: 800; margin-right: 0.625rem;
  }
  .total-name { display: inline-block; vertical-align: middle; font-size: 1.375rem; font-weight: 700; }

  /* Loading / Empty */
  #loading {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
  }

  .spinner {
    width: 3rem; height: 3rem;
    border-radius: 50%;
    border: 0.25rem solid var(--pend);
    border-top-color: transparent;
    -webkit-animation: spin 0.8s linear infinite;
    animation: spin 0.8s linear infinite;
  }

  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  #empty-state {
    background: var(--surface);
    border-radius: 1.5rem;
    padding: 3rem 1rem;
    text-align: center;
    border: 0.125rem solid var(--card-line);
    margin: 0.625rem 1.5rem;
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    display: none;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -ms-flex-direction: column;
    flex-direction: column;
  }

  #empty-state p     { font-size: 2.5rem; font-weight: 700; }
  #empty-state small { font-size: 1.5rem; color: var(--ink-soft); margin-top: 0.5rem; }

  #error-box {
    background: rgba(190,18,60,0.18);
    border: 0.125rem solid var(--late);
    border-radius: 1rem;
    padding: 1.25rem;
    text-align: center;
    display: none;
    margin: 0.625rem 1.5rem;
  }

  #error-box p { color: var(--ink); font-size: 1.5rem; }

  #retry-btn {
    margin-top: 0.75rem;
    padding: 0.5rem 1.5rem;
    border-radius: 0.75rem;
    background: var(--pend);
    color: #1A1100;
    border: none;
    font-size: 1.25rem;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
  }

  /* ── Celular (< 900 px): tres tarjetas grandes; al tocar una se despliegan sus pedidos ──
     El rem de la TV depende del ancho de pantalla (da ~3 px en un celular), por eso aquí se fija. */
  @media (max-width: 899px) {
    html { font-size: 15px; height: auto; }
    body { height: auto; max-height: none; min-height: 100%; overflow-y: auto; overflow-x: hidden; }
    #header { height: auto; min-height: 52px; padding: 8px 12px; -ms-flex-wrap: wrap; flex-wrap: wrap; }
    #header h1 { font-size: 22px; }
    #header-right { -ms-flex-wrap: wrap; flex-wrap: wrap; font-size: 14px; }
    #header-right > * { margin-left: 12px; font-size: 14px; }
    #test-sound { min-height: 44px; }
    #grid { -webkit-box-orient: vertical; -ms-flex-direction: column; flex-direction: column; overflow: visible; padding: 8px 12px 16px; }
    #grid .col { -webkit-box-flex: 0; -ms-flex: none; flex: none; margin: 0 0 12px 0; padding: 0; border-width: 2px; border-radius: 18px; overflow: hidden; }
    #grid .col-header { height: auto; min-height: 64px; margin: 0; padding: 12px 16px; cursor: pointer; }
    #grid .col-label { font-size: 22px; }
    #grid .col-hint { display: none; }
    #grid .col-badge { font-size: 22px; min-width: 44px; height: 44px; line-height: 44px; }
    #grid .col-extra { display: none !important; }
    #grid .col-right:after { content: "\25BE"; font-size: 24px; margin-left: 14px; color: var(--ink-soft); }
    #grid .col.open .col-right:after { content: "\25B4"; }
    #grid .col-cards { display: none; overflow: visible; padding: 0 12px 12px; }
    #grid .col.open .col-cards { display: block; }
    #grid .card, #grid .col-ready .card { width: 100%; margin-right: 0; }
    #grid .card.clickable { min-height: 44px; }
    #grid .btn-cancel { min-height: 44px; }
    body { padding-bottom: 46px; }
    #totals { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; height: 42px; padding: 0 0 0 12px; }
    #totals-label { font-size: 11px; margin-right: 10px; }
    .total-chip { margin-right: 18px; }
    .total-qty { min-width: 24px; height: 24px; line-height: 24px; font-size: 14px; margin-right: 6px; }
    .total-name { font-size: 15px; }
  }
</style>
</head>
<body>

<button id="sound-banner" type="button">Sonido desactivado: haz clic aquí para activarlo</button>

<div id="header">
  <h1>Cocina</h1>
  <div id="header-right">
    <span id="new-flash"></span>
    <span id="order-count">Cargando...</span>
    <span><span id="status-dot"></span><span id="status-text">Conectando...</span></span>
    <button id="test-sound" type="button">Probar sonido</button>
  </div>
</div>

<div id="error-box">
  <p id="error-msg">Error al conectar</p>
  <button id="retry-btn">Reintentar</button>
</div>

<div id="loading"><div class="spinner"></div></div>

<div id="empty-state">
  <p>Sin órdenes activas</p>
  <small>Las nuevas órdenes aparecerán aquí al instante</small>
</div>

<div id="grid" style="display:none">
  <div class="col col-pending">
    <div class="col-header">
      <div class="col-title"><span class="col-label">Pendientes</span><span class="col-hint">clic: iniciar</span></div>
      <div class="col-right"><span class="col-extra" id="extra-pending"></span><span class="col-badge" id="badge-pending">0</span></div>
    </div>
    <div class="col-cards" id="cards-pending"></div>
  </div>
  <div class="col col-cooking">
    <div class="col-header">
      <div class="col-title"><span class="col-label">En cocina</span><span class="col-hint">clic: marcar listo</span></div>
      <div class="col-right"><span class="col-extra" id="extra-cooking"></span><span class="col-badge" id="badge-cooking">0</span></div>
    </div>
    <div class="col-cards" id="cards-cooking"></div>
  </div>
  <div class="col col-ready">
    <div class="col-header">
      <div class="col-title"><span class="col-label">Listas</span></div>
      <div class="col-right"><span class="col-extra" id="extra-ready"></span><span class="col-badge" id="badge-ready">0</span></div>
    </div>
    <div class="col-cards" id="cards-ready"></div>
  </div>
</div>

<div id="totals" style="display:none">
  <div id="totals-label">TOTAL ACTIVO</div>
  <div id="totals-list"></div>
</div>

<script src="/kitchen-tv.js"></script>
</body>
</html>
